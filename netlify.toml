# Static site + four functions:
#   invite-preview — serves /join/* and /invite/* with per-table OG tags
#   og-image       — renders the per-table 1200x630 preview card PNG
#   receipt-preview — serves /receipt/* (a shared game, as a receipt) with its OG tags
#   og-receipt      — renders the receipt's 1200x1200 card PNG
#   og-receipt-video — the same card as a short mp4, the moment's clip composed live (ffmpeg-static)
# Routing to the functions lives in _redirects (rewrites take precedence
# over function URLs, so the pretty paths map there explicitly).

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.og-image]
  # Native napi module — keep out of the esbuild bundle; Netlify packages
  # it (and its platform binary) from node_modules instead.
  external_node_modules = ["@resvg/resvg-js"]

[functions.og-receipt]
  external_node_modules = ["@resvg/resvg-js"]

[functions.og-receipt-video]
  # resvg (napi) and ffmpeg-static (an ~80 MB binary) stay out of the
  # esbuild bundle; Netlify packages them from node_modules.
  external_node_modules = ["@resvg/resvg-js", "ffmpeg-static"]
