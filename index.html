<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Smart App Banner. Safari on iOS draws a native strip above the page
       that installs from the App Store, or opens the app if it is already
       installed. The id matches APP_STORE_ID in the app repo
       (src/config/appStore.ts); keep the two in sync if the listing moves. -->
  <meta name="apple-itunes-app" content="app-id=6769199909" />
  <title>Mahjong Alley</title>
  <meta name="description" content="A serious game for serious players. Learn and play American Mahjong solo or with friends." />
  <meta property="og:title" content="Mahjong Alley" />
  <meta property="og:description" content="Let's mahj." />
  <!-- og:image is what makes iMessage/WhatsApp render a rich card at all —
       absolute URL required (crawlers don't resolve relative paths). -->
  <meta property="og:image" content="https://mahjongalley.com/assets/og-card.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mahjong Alley" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mahjong Alley" />
  <meta name="twitter:description" content="Let's mahj." />
  <meta name="twitter:image" content="https://mahjongalley.com/assets/og-card.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <link rel="preload" href="/assets/fonts/TAYBarro.otf" as="font" type="font/otf" crossorigin />
  <style>
    @font-face {
      font-family: 'TAY Barro';
      src: url('/assets/fonts/TAYBarro.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --cream: #F2E8D5;
      --navy: #1A1A2E;
      --cobalt: #536AFA;
      --pink: #FB79B9;
      --dim: #5A5F72;
      --card: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 8px 0 24px;
    }
    /* The dragon tile WITH the wordmark on it (Ellen, 2026-10-23) — one
       object instead of a tile over a logo; the app icon handoff stays. */
    .tile-img {
      width: 200px;
      height: auto;
      margin-bottom: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .logo {
      display: block;
      width: 250px;
      max-width: 85%;
      height: auto;
      margin: 0 auto;
      color: var(--navy);
    }
    .invite-headline { font-size: 26px; font-weight: 500; letter-spacing: -0.3px; margin-top: 16px; }
    .sub { color: var(--dim); font-size: 15px; line-height: 1.5; margin-top: 40px; }
    .sub .tagline {
      display: block;
      font-family: 'TAY Barro', 'Inter', -apple-system, sans-serif;
      font-weight: normal;
      font-size: 21px;
      line-height: 1.25;
      color: var(--navy);
      margin-bottom: 6px;
    }
    /* Pink strike, navy word — the line is the joke, so it gets the color. */
    .sub .tagline s { text-decoration-thickness: 2px; text-decoration-color: var(--pink); }
    .code-label {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--dim);
    }
    .code {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-top: 6px;
      padding-left: 8px; /* optically recenter the letterspaced text */
      user-select: all;
      -webkit-user-select: all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 14px;
    }
    .btn-primary { background: var(--cobalt); color: #fff; }
    .btn-secondary { background: rgba(83,106,250,0.18); color: var(--navy); }
    .buttons { margin-top: 28px; }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.5; margin-top: 20px; }
    .footer { margin-top: 36px; }
    .footer a { color: var(--cobalt); font-size: 13px; font-weight: 600; text-decoration: none; }
    .footer-sep { color: var(--dim); font-size: 13px; margin: 0 6px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="tile-img" src="/assets/tile-wordmark.png?v=2" alt="" aria-hidden="true" />
    <h1 class="sr-only">Mahjong Alley</h1>
    <p class="invite-headline" id="headline" hidden></p>
    <p class="sub" id="subline"><span class="tagline">A <s>serious</s> game for serious players</span>Learn and play American Mahjong solo or with friends.</p>

    <div id="invite" hidden>
      <p class="code-label" id="code-label">Invite code</p>
      <p class="code" id="code"></p>
    </div>

    <div class="buttons">
      <a class="btn btn-primary" id="open-app" href="#" hidden>Open in the app</a>
      <a class="btn btn-secondary" id="get-app" href="https://apps.apple.com/app/id6769199909">Get the app</a>
    </div>

    <p class="hint" id="hint" hidden></p>

    <p class="footer">
      <a href="/support/">Support</a>
      <span class="footer-sep">·</span>
      <a href="/privacy/">Privacy</a>
      <span class="footer-sep">·</span>
      <a href="/terms/">Terms</a>
      <span class="footer-sep">·</span>
      <a href="https://www.instagram.com/mahjongalley/">@mahjongalley</a>
    </p>
  </main>

  <script>
    // /join/ABC123 (6-char table code) or /invite/ABCD2345 (8-char friend
    // code). Served via the 404 fallback, so parse the live path.
    //
    // The page renders a generic version at once, then asks the same
    // public peek the link-preview card uses (0084 / 0120) and swaps in
    // the host's name and table, or the friend's name (Ellen, 2026-10-23:
    // "You're invited to a table" was the wrong phrase once the card
    // already said who). A failed peek leaves the generic copy.
    (function () {
      var m = location.pathname.match(/^\/(join|invite)\/([A-Za-z0-9]{4,12})\/?$/);
      if (!m) return;
      var kind = m[1];
      var code = m[2].toUpperCase();

      var headline = document.getElementById('headline');
      var subline = document.getElementById('subline');
      headline.textContent =
        kind === 'join' ? 'A friend saved you a seat' : 'A friend wants to connect';
      headline.hidden = false;
      if (kind === 'invite') {
        document.getElementById('code-label').textContent = 'Friend code';
      }
      subline.textContent =
        kind === 'join'
          ? 'There’s a table waiting for you on Mahjong Alley.'
          : 'Join them on Mahjong Alley.';

      document.getElementById('code').textContent = code;
      document.getElementById('invite').hidden = false;
      var hint = document.getElementById('hint');
      hint.textContent =
        kind === 'join'
          ? 'New here? Get the app, then come back and tap this link. Already have it? Tap Open in the app, or enter the code under Join a table.'
          : 'New here? Get the app, then come back and tap this link. Already have it? Tap Open in the app.';
      hint.hidden = false;

      var open = document.getElementById('open-app');
      open.href = 'mahjong://' + kind + '/' + code;
      open.hidden = false;

      // A custom-scheme link with no app to answer it is a dead end: iOS
      // Safari puts up "cannot open the page" and stops there. So the tap
      // is handled here instead. Try the scheme; if this page is still
      // the one on screen a moment later, the app did not take over, and
      // the store is where this person needs to go. `document.hidden`
      // (or the timer firing late, after a suspended tab wakes) means the
      // app DID open, and the store must not replace it when they return.
      open.addEventListener('click', function (e) {
        e.preventDefault();
        var started = Date.now();
        location.href = open.href;
        setTimeout(function () {
          if (document.hidden || Date.now() - started > 2500) return;
          location.href = document.getElementById('get-app').href;
        }, 1200);
      });

      // ---- Personalize from the public peek (same pair the app ships) ----
      var SUPABASE_URL = 'https://bhtuztrwgpyzhxipcjda.supabase.co';
      var SUPABASE_KEY = 'sb_publishable_86_PUFmbyZ5tKDuik07Y8A_8xNqUTE3';
      var fn = kind === 'join' ? 'peek_lobby_preview' : 'peek_app_invite';
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      if (ctrl) setTimeout(function () { ctrl.abort(); }, 4000);
      fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          authorization: 'Bearer ' + SUPABASE_KEY,
          'content-type': 'application/json',
        },
        body: JSON.stringify({ p_code: code }),
        signal: ctrl ? ctrl.signal : undefined,
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (rows) {
          var row = Array.isArray(rows) ? rows[0] : null;
          if (!row) return;
          if (kind === 'join') {
            var host = row.host_display_name || 'A friend';
            var table = row.name || host + '’s Table';
            var pace = row.mode === 'async' ? 'Async' : row.mode === 'live_scheduled' ? 'Scheduled' : 'Live';
            var rules = row.rules_mode === 'social' ? 'House Rules' : 'NMJL Standard';
            headline.textContent = host + ' saved you a seat';
            subline.textContent =
              table + ' · ' + Number(row.seat_count || 0) + ' of ' + Number(row.max_players || 4) +
              ' seated · ' + pace + ' · ' + rules;
          } else {
            var name = row.display_name || 'A friend';
            headline.textContent = name + ' wants to be friends';
            subline.textContent = 'Join them on Mahjong Alley.';
          }
        })
        .catch(function () { /* generic copy stays */ });
    })();
  </script>
</body>
</html>
