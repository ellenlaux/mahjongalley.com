<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Smart App Banner. Safari on iOS draws a native strip above the page
       that installs from the App Store, or opens the app if it is already
       installed. The id matches APP_STORE_ID in the app repo
       (src/config/appStore.ts); keep the two in sync if the listing moves. -->
  <meta name="apple-itunes-app" content="app-id=6769199909" />
  <title>Mahjong Alley</title>
  <meta name="description" content="A serious game for serious players. Learn, practice, and play American Mahjong — solo or with friends." />
  <meta property="og:title" content="Mahjong Alley" />
  <meta property="og:description" content="Let's mahj." />
  <!-- og:image is what makes iMessage/WhatsApp render a rich card at all —
       without it a texted invite link shows as bare text. Absolute URL
       required (crawlers don't resolve relative paths). -->
  <meta property="og:image" content="https://mahjongalley.com/assets/og-card.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mahjong Alley" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mahjong Alley" />
  <meta name="twitter:description" content="Let's mahj." />
  <meta name="twitter:image" content="https://mahjongalley.com/assets/og-card.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <link rel="preload" href="/assets/fonts/TAYBarro.otf" as="font" type="font/otf" crossorigin />
  <script>
    // Before the first paint, so an invite link never flashes the plain page.
    if (/^\/(join|invite)\/[A-Za-z0-9]{4,12}\/?$/.test(location.pathname)) {
      document.documentElement.classList.add('invite-page');
    }
  </script>
  <style>
    @font-face {
      font-family: 'TAY Barro';
      src: url('/assets/fonts/TAYBarro.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --cream: #F2E8D5;
      --navy: #1A1A2E;
      --cobalt: #536AFA;
      --pink: #FB79B9;
      --dim: #5A5F72;
      --card: #FFFFFF;
      --gold: #FBE5AC;
      --ivory: #F8F3E9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 8px 0 24px;
    }
    /* The dragon tile WITH the wordmark on it (Ellen, 2026-10-23) — one
       object instead of a tile over a logo; the app icon handoff stays. */
    .tile-img {
      width: 200px;
      height: auto;
      margin-bottom: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .logo {
      display: block;
      width: 250px;
      max-width: 85%;
      height: auto;
      margin: 0 auto;
      color: var(--navy);
    }
    .invite-headline { font-size: 26px; font-weight: 500; letter-spacing: -0.3px; margin-top: 16px; }
    .sub { color: var(--dim); font-size: 15px; line-height: 1.5; margin-top: 40px; }
    .sub .tagline {
      display: block;
      font-family: 'TAY Barro', 'Inter', -apple-system, sans-serif;
      font-weight: normal;
      font-size: 21px;
      line-height: 1.25;
      color: var(--navy);
      margin-bottom: 6px;
    }
    /* Pink strike, navy word — the line is the joke, so it gets the color. */
    .sub .tagline s { text-decoration-thickness: 2px; text-decoration-color: var(--pink); }
    .code-label {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--dim);
    }
    .code {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-top: 6px;
      padding-left: 8px; /* optically recenter the letterspaced text */
      user-select: all;
      -webkit-user-select: all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 14px;
    }
    .btn-primary { background: var(--cobalt); color: #fff; }
    .btn-secondary { background: rgba(83,106,250,0.18); color: var(--navy); }
    .buttons { margin-top: 28px; }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.5; margin-top: 20px; }
    .footer { margin-top: 36px; }
    .footer a { color: var(--cobalt); font-size: 13px; font-weight: 600; text-decoration: none; }
    .footer-sep { color: var(--dim); font-size: 13px; margin: 0 6px; }
    /* An invite link wears the card that was texted (Ellen, 2026-10-30): the
       same gold, the tile pile, then "Hey!" and the name on an ivory chip, in
       the card's order and words. The class is set in <head>. */
    .pile { display: none; }
    .invite-page body { background: var(--gold); }
    .invite-page .tile-img { display: none; }
    .invite-page .pile {
      display: block;
      width: 200px;
      height: auto;
      margin: 0 auto;
    }
    .invitation { font-size: 22px; line-height: 1.25; margin-top: 18px; }
    .invitation > span { display: block; }
    .invitation > .who {
      display: inline-block;
      max-width: 100%;
      margin: 10px 0 12px;
      padding: 12px 18px;
      border-radius: 6px;
      background: var(--ivory);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      overflow-wrap: anywhere;
    }
    .table-line { font-size: 16px; font-weight: 600; line-height: 1.35; margin-top: 12px; }
    /* Held back until the peek answers, so "A friend" never flips to a name. */
    .is-waiting { visibility: hidden; }
    .invite-page .invite-headline { margin-top: 18px; }
    .invite-page .sub { margin-top: 8px; }
    .invite-page .buttons { margin-top: 20px; }
    .invite-page .btn { margin-top: 10px; }
    .invite-page .btn-primary { background: var(--navy); color: var(--ivory); }
    .invite-page .btn-secondary { background: var(--ivory); color: var(--navy); }
    .invite-page .code-label { margin-top: 24px; }
    .invite-page .code { font-size: 28px; letter-spacing: 6px; margin-top: 4px; padding-left: 6px; }
    .invite-page .hint { margin-top: 16px; }
    .invite-page .footer { margin-top: 24px; }
    .invite-page .footer a { color: var(--navy); }
  </style>
</head>
<body>
  <main class="card">
    <img class="tile-img" src="/assets/tile-wordmark.svg?v=3" alt="" aria-hidden="true" />
    <!-- src set below: only an invite link pays for the pile. -->
    <img class="pile" id="pile" width="720" height="796" alt="" aria-hidden="true" />
    <h1 class="sr-only">Mahjong Alley</h1>
    <p class="invitation is-waiting" id="invitation" hidden>
      <span>Hey!</span>
      <span class="who" id="who"></span>
      <span id="action"></span>
      <span>Mahjong Alley</span>
    </p>
    <p class="table-line is-waiting" id="table-line" hidden>&nbsp;</p>
    <p class="invite-headline" id="headline" hidden></p>
    <p class="sub" id="subline"><span class="tagline">A <s>serious</s> game for serious players</span>Learn, practice, and play American Mahjong — solo or with friends.</p>

    <div class="buttons">
      <!-- "Get the app" leads. Someone who HAS the app and scans or taps
           the link never sees this page: the universal link opens the app
           directly. So the person reading this is almost always the one
           without it, and the big button should be theirs. -->
      <a class="btn btn-primary" id="get-app" href="https://apps.apple.com/app/id6769199909">Get the app</a>
      <a class="btn btn-secondary" id="open-app" href="#" hidden>Open in the app</a>
    </div>

    <div id="invite" hidden>
      <p class="code-label" id="code-label">Table code</p>
      <p class="code" id="code"></p>
    </div>

    <p class="hint" id="hint" hidden></p>

    <p class="footer">
      <a href="/support/">Support</a>
      <span class="footer-sep">·</span>
      <a href="/privacy/">Privacy</a>
      <span class="footer-sep">·</span>
      <a href="/terms/">Terms</a>
      <span class="footer-sep">·</span>
      <a href="https://www.instagram.com/mahjongalley/">@mahjongalley</a>
    </p>
  </main>

  <script>
    // /join/ABC123 (6-char table code) or /invite/ABCD2345 (8-char friend
    // code). Served via the 404 fallback, so parse the live path.
    //
    // The page renders a generic version at once, then asks the same
    // public peek the link-preview card uses (0084 / 0120) and swaps in
    // the host's name and table, or the friend's name (Ellen, 2026-10-23:
    // "You're invited to a table" was the wrong phrase once the card
    // already said who). A failed peek leaves the generic copy. A table
    // the peek says is closed, full or unknown says so, because "saved you
    // a seat" would be false there (the card goes plain for the same reason).
    (function () {
      var m = location.pathname.match(/^\/(join|invite)\/([A-Za-z0-9]{4,12})\/?$/);
      if (!m) return;
      var kind = m[1];
      var code = m[2].toUpperCase();

      var headline = document.getElementById('headline');
      var subline = document.getElementById('subline');
      var invitation = document.getElementById('invitation');
      var who = document.getElementById('who');
      var tableLine = document.getElementById('table-line');
      document.getElementById('pile').src = '/assets/invite-pile-page.webp';
      subline.hidden = true;
      invitation.hidden = false;
      if (kind === 'join') tableLine.hidden = false;
      document.getElementById('action').textContent =
        kind === 'join' ? 'saved you a seat on' : 'wants to be friends on';
      if (kind === 'invite') {
        document.getElementById('code-label').textContent = 'Friend code';
      }

      // The card's arithmetic: Inter Bold runs about 0.66em a glyph, so the
      // longest handle (21 with its @) shrinks to fit the chip's one line.
      function setWho(name) {
        who.textContent = name;
        var room = invitation.clientWidth - 36;
        who.style.fontSize = Math.min(36, Math.floor(room / (0.66 * name.length))) + 'px';
      }
      setWho('A friend');

      document.getElementById('code').textContent = code;
      document.getElementById('invite').hidden = false;
      var hint = document.getElementById('hint');
      hint.textContent =
        kind === 'join'
          ? 'New here? Get the app, then come back and tap this link. Already have it? Tap Open in the app, or enter the table code there.'
          : 'New here? Get the app, then come back and tap this link. Already have it? Tap Open in the app.';
      hint.hidden = false;

      var open = document.getElementById('open-app');
      open.href = 'mahjong://' + kind + '/' + code;
      open.hidden = false;

      // A custom-scheme link with no app to answer it is a dead end: iOS
      // Safari puts up "cannot open the page" and stops there. So the tap
      // is handled here instead. Try the scheme; if this page is still
      // the one on screen a moment later, the app did not take over, and
      // the store is where this person needs to go. `document.hidden`
      // (or the timer firing late, after a suspended tab wakes) means the
      // app DID open, and the store must not replace it when they return.
      open.addEventListener('click', function (e) {
        e.preventDefault();
        var started = Date.now();
        location.href = open.href;
        setTimeout(function () {
          if (document.hidden || Date.now() - started > 2500) return;
          location.href = document.getElementById('get-app').href;
        }, 1200);
      });

      function showClosed() {
        invitation.hidden = true;
        tableLine.hidden = true;
        headline.textContent = 'This table is no longer open';
        headline.hidden = false;
        subline.textContent = 'It may have filled up or already started.';
        subline.hidden = false;
        document.getElementById('invite').hidden = true;
        hint.hidden = true;
        open.hidden = true;
      }
      function reveal() {
        invitation.classList.remove('is-waiting');
        tableLine.classList.remove('is-waiting');
      }

      // ---- Personalize from the public peek (same pair the app ships) ----
      var SUPABASE_URL = 'https://bhtuztrwgpyzhxipcjda.supabase.co';
      var SUPABASE_KEY = 'sb_publishable_86_PUFmbyZ5tKDuik07Y8A_8xNqUTE3';
      var fn = kind === 'join' ? 'peek_lobby_preview' : 'peek_app_invite';
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      if (ctrl) setTimeout(function () { ctrl.abort(); }, 4000);
      fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          authorization: 'Bearer ' + SUPABASE_KEY,
          'content-type': 'application/json',
        },
        body: JSON.stringify({ p_code: code }),
        signal: ctrl ? ctrl.signal : undefined,
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (rows) {
          var row = Array.isArray(rows) ? rows[0] : null;
          if (kind === 'join' && Array.isArray(rows) && (!row || !row.joinable)) {
            showClosed();
            return;
          }
          if (!row) return;
          if (kind === 'join') {
            // The card's words: hostLabel, tableLabel and whenLabel in
            // netlify/functions/peeks.mjs. Keep the two together.
            var shown = row.host_display_name || 'A friend';
            var host = row.host_handle
              ? '@' + row.host_handle
              : /^Player-[0-9A-F]{4}$/.test(shown) ? 'A friend' : shown;
            var table = row.name || shown + '’s Table';
            if (/^Player-[0-9A-F]{4}’s Table$/.test(table)) table = host + '’s Table';
            var when = row.mode === 'async' ? 'Async' : row.mode === 'live_scheduled' ? 'Scheduled' : 'Join now';
            setWho(host);
            tableLine.textContent = table + ' · ' + when;
          } else {
            setWho(row.display_name || 'A friend');
          }
        })
        .catch(function () { /* generic copy stays */ })
        .then(reveal);
    })();
  </script>
</body>
</html>
